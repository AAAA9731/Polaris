name: Release

# 推送形如 v2.0.1 的标签时：构建、冒烟测试，然后创建 GitHub Release 并附上安装器。
#   git tag v2.0.1 && git push origin v2.0.1

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      require-game: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 标签与 csproj 版本号一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' PolarisCore.csproj | head -1)"
          echo "tag=$tag csproj=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 PolarisCore.csproj 的 <Version> ($version) 不一致"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: polaris-dist
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Polaris $GITHUB_REF_NAME" \
            --generate-notes $prerelease
